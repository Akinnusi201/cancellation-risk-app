name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify repository contract
        run: python scripts/verify_repository.py

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Smoke-test packaged production inference
        run: |
          python - <<'PY'
          from src.models.registry import load_active_model
          from src.ui.common import REFERENCE_PATH
          model, meta = load_active_model()
          assert model is not None, "Packaged production model did not load"
          assert meta and meta.get("dataset_version"), "Production metadata missing"
          assert REFERENCE_PATH.exists(), "Packaged reference orders missing"
          print("Production model:", meta.get("model_version"))
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cancellation-risk-app:ci .
